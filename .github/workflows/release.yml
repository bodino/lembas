# Builds lembas from this repository's public source and publishes it as a GitHub
# release. Members' apps update only from these releases, never from a pool, so the
# person running a pool can't ship code to members; and only when version.json is
# signed by the release key, so neither can someone who merely gets to publish a
# release or push a tag. The build runs without the key. Signing is a separate job in
# the "release" environment, which holds the key (LEMBAS_SIGNING_KEY) and requires a
# reviewer's approval, so a tag that changed the build can't read it. Every release also
# carries build provenance: anyone can check that lembas.zip came from this workflow and
# commit with
#   gh attestation verify lembas.zip --repo bodino/lembas
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write     # sign the provenance
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the tag matches the app version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" resources/Info.plist)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match Info.plist version $VERSION" >&2
            exit 1
          fi

      # The MPC helper builds its dependencies (mpz, TLSNotary's multiplexer) from
      # source; cache the registry and the crate's target directory so a release
      # doesn't start from zero every time.
      - name: Cache the Rust build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mpc-tls/lembas-mpc/target
          key: lembas-mpc-${{ runner.os }}-${{ hashFiles('mpc-tls/lembas-mpc/Cargo.lock') }}
          restore-keys: lembas-mpc-${{ runner.os }}-

      - name: Build (unsigned)
        run: ./build.sh

      - name: Record provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: installer/lembas.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer
          path: |
            installer/lembas.zip
            installer/version.json
          if-no-files-found: error

  # Only this job sees the signing key, only after approval, and it runs nothing from
  # the tag's checkout: it signs what the build job produced and publishes it.
  sign-and-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write     # create the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer
          path: installer

      - name: Sign version.json
        env:
          LEMBAS_SIGNING_KEY: ${{ secrets.LEMBAS_SIGNING_KEY }}
        run: |
          node -e '
            const fs = require("node:fs");
            const { sign, createHash } = require("node:crypto");
            const v = JSON.parse(fs.readFileSync("installer/version.json", "utf8"));
            const sha = createHash("sha256").update(fs.readFileSync("installer/lembas.zip")).digest("hex");
            if (sha !== v.sha256) throw new Error("version.json does not match lembas.zip");
            v.signature = sign(null, Buffer.from(`${v.version} ${v.build} ${v.sha256}`), process.env.LEMBAS_SIGNING_KEY).toString("base64");
            fs.writeFileSync("installer/version.json", JSON.stringify(v) + "\n");
            console.log("signed", v.version, v.build);
          '

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" installer/lembas.zip installer/version.json \
            --title "lembas ${GITHUB_REF_NAME#v}" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" installer/lembas.zip installer/version.json --clobber
