[package]
name = "lembas-mpc"
version = "0.0.0"
edition = "2024"
publish = false
description = "Borrowed requests with a spliced token record: pool and borrower helpers, and an in-process demo"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "demo"
path = "src/main.rs"

[[bin]]
name = "lembas-mpc"
path = "src/bin/lembas-mpc.rs"

[dependencies]
tls-server-fixture = { workspace = true }
tlsn-mux = { workspace = true }

mpz-common = { workspace = true }
mpz-core = { workspace = true }
mpz-garble-core = { workspace = true }
mpz-ot = { workspace = true }
mpz-circuits = { workspace = true, features = ["aes"] }
mpz-fields = { workspace = true }
mpz-memory-core = { workspace = true }
mpz-ole = { workspace = true }
mpz-share-conversion = { workspace = true }
mpz-vm-core = { workspace = true }
mpz-zk = { workspace = true }

rustls = { workspace = true, features = ["std", "tls12", "ring"] }
aes = { workspace = true }
aes-gcm = { workspace = true }

rustls-pki-types = { workspace = true }
rustls-webpki = { workspace = true }
webpki-roots = { workspace = true }

anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
futures = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serio = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time", "net", "fs"] }
tokio-util = { workspace = true, features = ["compat"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
